<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Isometric Room</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H8GK01WJQ7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-H8GK01WJQ7');
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.3rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
      color: #111;
    }

    .room-wrap { position: relative; width: 100%; max-width: 680px; }
    .room-wrap img { width: 100%; display: block; border-radius: 16px; }

    .hotspot {
      position: absolute;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(2px);
      transition: transform 0.15s, background 0.15s;
    }
    .hotspot:hover { transform: scale(1.2); background: rgba(255,255,255,0.5); }
    .hotspot .pulse {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0;   }
    }
    .hotspot i { font-size: 18px; color: #fff; pointer-events: none; }
    .hotspot-label {
      position: absolute;
      top: calc(100% + 6px); left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff;
      font-size: 11px; padding: 2px 7px;
      border-radius: 20px; white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 0.15s;
    }
    .hotspot:hover .hotspot-label { opacity: 1; }

    .backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100; align-items: center; justify-content: center;
    }
    .backdrop.open { display: flex; }

    .panel {
      background: #fff; border-radius: 16px;
      border: 1px solid #e5e5e5; padding: 1.5rem;
      width: 90%; max-width: 480px; max-height: 80vh;
      overflow-y: auto; position: relative;
    }
    .panel h2 {
      font-size: 18px; font-weight: 500;
      margin-bottom: 1rem;
      display: flex; align-items: center; gap: 8px; color: #111;
    }
    .close-btn {
      position: absolute; top: 1rem; right: 1rem;
      background: none; border: none; cursor: pointer;
      color: #888; font-size: 20px; padding: 4px; line-height: 1;
    }
    .close-btn:hover { color: #111; }

    .info-row {
      display: flex; gap: 10px; margin-bottom: 10px;
      font-size: 14px; color: #555; align-items: flex-start;
    }
    .info-row i { color: #111; margin-top: 2px; flex-shrink: 0; }

    .site-card {
      border: 1px solid #e5e5e5; border-radius: 10px;
      padding: 0.75rem 1rem; margin-bottom: 10px;
      display: flex; align-items: center; gap: 12px;
    }
    .site-thumb {
      width: 48px; height: 48px; border-radius: 8px;
      background: #f0f0f0; display: flex;
      align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .site-info { flex: 1; min-width: 0; }
    .site-name { font-size: 14px; font-weight: 500; color: #111; }
    .site-url  { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .achievement-item {
      border: 1px solid #e5e5e5; border-radius: 10px;
      padding: 0.65rem 1rem; margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: #333;
    }
    .achievement-item i { font-size: 18px; color: #c8a500; }

    .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .gallery-item {
      border-radius: 10px; background: #f0f0f0;
      aspect-ratio: 4/3; display: flex;
      align-items: center; justify-content: center;
      font-size: 28px; border: 1px solid #e5e5e5; overflow: hidden;
    }

    .resume-section { margin-bottom: 1rem; }
    .resume-section h3 {
      font-size: 12px; font-weight: 500; color: #888;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;
    }
    .resume-tag {
      display: inline-block; background: #f0f0f0;
      border: 1px solid #e5e5e5; border-radius: 20px;
      font-size: 12px; padding: 3px 10px; margin: 3px; color: #333;
    }
    .download-link {
      font-size: 14px; color: #0070f3;
      display: flex; align-items: center; gap: 6px;
      text-decoration: none; margin-top: 1rem;
    }
    .download-link:hover { text-decoration: underline; }

    .music-btn {
      position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 200;
      width: 48px; height: 48px; border-radius: 50%;
      background: #5a7a4a; border: 2px solid #3d5c33;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px;
      transition: transform 0.15s, background 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .music-btn:hover { transform: scale(1.1); background: #4a6a3a; }

    .social-bar { display: flex; gap: 12px; margin-top: 1.25rem; }
    .social-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: #5a7a4a; border: 2px solid #3d5c33;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; text-decoration: none;
      transition: transform 0.15s, background 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .social-btn:hover { transform: scale(1.15); background: #4a6a3a; }

    #loader {
      position: fixed; inset: 0; z-index: 999;
      background: #e8f0e2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.5rem;
      transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .loader-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.1rem; color: #3d5c33;
      text-align: center; line-height: 1.8;
    }
    .loader-room { width: 120px; height: 120px; position: relative; }
    .cube {
      width: 60px; height: 60px;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      transform-style: preserve-3d;
      animation: spin 2.5s linear infinite;
    }
    @keyframes spin {
      from { transform: translate(-50%,-50%) rotateX(30deg) rotateY(0deg); }
      to   { transform: translate(-50%,-50%) rotateX(30deg) rotateY(360deg); }
    }
    .cube-face { position: absolute; width: 60px; height: 60px; border: 2px solid #3d5c33; }
    .cube-face.top    { background: #a8c896; transform: rotateX(90deg)   translateZ(30px); }
    .cube-face.front  { background: #7aaa68; transform: translateZ(30px); }
    .cube-face.right  { background: #5a7a4a; transform: rotateY(90deg)   translateZ(30px); }
    .cube-face.back   { background: #7aaa68; transform: rotateY(180deg)  translateZ(30px); }
    .cube-face.left   { background: #5a7a4a; transform: rotateY(-90deg)  translateZ(30px); }
    .cube-face.bottom { background: #4a6a3a; transform: rotateX(-90deg)  translateZ(30px); }
    .loader-bar-wrap {
      width: 220px; height: 10px; background: #c8ddb8;
      border-radius: 99px; overflow: hidden; border: 1px solid #3d5c33;
    }
    .loader-bar {
      height: 100%; width: 0%; background: #3d5c33;
      border-radius: 99px; animation: fillBar 1.8s ease-out forwards;
    }
    @keyframes fillBar { 0% { width:0%; } 60% { width:75%; } 100% { width:100%; } }
    .loader-sub {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem; color: #5a7a4a; letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="loader-title">MY ROOM</div>
    <div class="loader-room">
      <div class="cube">
        <div class="cube-face top"></div>
        <div class="cube-face front"></div>
        <div class="cube-face right"></div>
        <div class="cube-face back"></div>
        <div class="cube-face left"></div>
        <div class="cube-face bottom"></div>
      </div>
    </div>
    <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
    <div class="loader-sub">LOADING...</div>
  </div>

  <audio id="bgMusic" src="bg.mp3" loop></audio>
  <button class="music-btn" id="musicBtn" title="Toggle music">🔇</button>

  <h1>HI!, I'M MARTIN GASPAR AND THIS IS: MY ROOM</h1>

  <div class="room-wrap" id="room">
    <img src="Isometric.png" alt="Isometric room" id="roomImg" />
    <div class="hotspot" data-panel="profile">      <div class="pulse"></div><i class="ti ti-user"></i>      <span class="hotspot-label">Profile</span></div>
    <div class="hotspot" data-panel="websites">     <div class="pulse"></div><i class="ti ti-world"></i>     <span class="hotspot-label">Websites</span></div>
    <div class="hotspot" data-panel="achievements"> <div class="pulse"></div><i class="ti ti-trophy"></i>    <span class="hotspot-label">Achievements</span></div>
    <div class="hotspot" data-panel="resume">       <div class="pulse"></div><i class="ti ti-file-text"></i> <span class="hotspot-label">Resume</span></div>
    <div class="hotspot" data-panel="gallery">      <div class="pulse"></div><i class="ti ti-photo"></i>     <span class="hotspot-label">Gallery</span></div>
  </div>

  <div class="social-bar">
    <a class="social-btn" href="https://www.instagram.com/m3guu81/"                                                           target="_blank" title="Instagram"><i class="ti ti-brand-instagram"></i></a>
    <a class="social-btn" href="https://www.facebook.com/martin.gaspar.7127"                                                  target="_blank" title="Facebook"><i class="ti ti-brand-facebook"></i></a>
    <a class="social-btn" href="https://www.linkedin.com/in/martin-gaspar-6aa47b369/"                                         target="_blank" title="LinkedIn"><i class="ti ti-brand-linkedin"></i></a>
    <a class="social-btn" href="https://github.com/M3gu627"                                                                   target="_blank" title="GitHub"><i class="ti ti-brand-github"></i></a>
  </div>

  <div class="backdrop" id="backdrop">
    <div class="panel">
      <button class="close-btn" id="closeBtn"><i class="ti ti-x"></i></button>
      <div id="panelBody"></div>
    </div>
  </div>

  <script>
    // ── Data ──────────────────────────────────────────────────────────────────

    const HOTSPOT_POSITIONS = {
      profile:      [0.345, 0.500],
      websites:     [0.275, 0.270],
      achievements: [0.685, 0.545],
      resume:       [0.515, 0.735],
      gallery:      [0.755, 0.360],
    };

    const SITES = [
      { name: 'Panrama Technologies', domain: 'panramatechnologies.com',  url: 'https://panramatechnologies.com/' },
      { name: 'Momo Cart Logbook',    domain: 'momocartlogbook.com',       url: 'https://momocartlogbook.com/' },
      { name: 'Blueshirt HR',         domain: 'blueshirt.work',            url: 'https://employers.blueshirt.work/hr?menu=Applicant%20Welfare&signup_step=Welcome&verif=' },
      { name: 'Guanzon Pool',         domain: 'guanzonpool.com',           url: 'https://guanzonpool.com' },
    ];

    const ACHIEVEMENTS = [
      { icon: 'star', text: "Dean's Lister — Bulacan State University · 2021–present" },
      { icon: 'star', text: 'Gold Gear Awardee — Bulacan State University · 2021–present' },
      { icon: 'star', text: "With Honors — Dr. Yanga's Colleges Inc." },
      { icon: 'star', text: "Outstanding Scholastic Reader — Dr. Yanga's Colleges Inc." },
      { icon: 'book', text: 'Published research: Frequency of Engagement in Online Games &amp; Mental Health among Gen Z Youth' },
      { icon: 'book', text: 'Published research: Winner Winner Mango Ginger — meat shelf storage study' },
    ];

    const JOBS = [
      { company: 'Lei-lo Marketing',        role: 'Freelance Digital Artist',     dates: 'Jan 2019–Aug 2023',  desc: 'Graphics designer for brochures, posters, and promotional materials. On-site · Balagtas, Bulacan' },
      { company: 'Panrama Technologies',    role: 'Web Developer',                dates: 'Apr 2024–Jan 2026',  desc: 'Built and maintained panramatechnologies.com; improved SQL attendance database; designed marketing materials. Part-time · Hybrid · Baliwag, Bulacan' },
      { company: 'Blueshirt Philippines',   role: 'Software QA Tester Intern',    dates: 'Dec 2025–Mar 2026',  desc: 'Manual and automated testing with Cypress; supported software quality and applicant welfare operations. Internship · Hybrid · Quezon, Central Luzon' },
      { company: 'Momocart - Mobility Carts', role: 'Software Developer',         dates: 'Apr 2026–Jun 2026',  desc: 'Fullstack development and maintenance; built the Momocart Logbook system for fleet and cart management. Part-time · Hybrid · Philippines' },
    ];

    const SCHOOLS = [
      { name: "Dr. Yanga's Colleges Inc.", degree: 'Senior High ICT',                      years: '2015–2021',    note: 'With Honors · Outstanding Scholastic Reader' },
      { name: 'Bulacan State University',  degree: 'BS Industrial Technology (Computer)',   years: '2021–present', note: "Dean's Lister · Gold Gear Awardee" },
    ];

    const SKILLS = ['HTML/CSS','JavaScript','Python','Java','PHP','Arduino','Raspberry Pi','ESP32','SQL','Cypress','Graphic Design','Game Dev'];

    // ── HTML builder helpers (Extraction) ────────────────────────────────────

    const infoRow  = (icon, html)  => `<div class="info-row"><i class="ti ti-${icon}"></i><span>${html}</span></div>`;
    const siteCard = ({ name, domain, url }) => `
      <div class="site-card">
        <div class="site-thumb"><img src="https://www.google.com/s2/favicons?domain=${domain}&sz=48" width="32" height="32" style="border-radius:6px"></div>
        <div class="site-info"><div class="site-name">${name}</div><div class="site-url">${domain}</div></div>
        <a href="${url}" target="_blank"><i class="ti ti-external-link" style="color:#888"></i></a>
      </div>`;
    const achievementItem = ({ icon, text }) => `<div class="achievement-item"><i class="ti ti-${icon}"></i><span>${text}</span></div>`;
    const jobRow   = ({ company, role, dates, desc }) => infoRow('briefcase', `<strong>${company}</strong> — ${role} · ${dates}<br><small>${desc}</small>`);
    const schoolRow= ({ name, degree, years, note }) => infoRow('school', `<strong>${name}</strong> — ${degree} · ${years}<br><small>${note}</small>`);
    const resumeTag= s => `<span class="resume-tag">${s}</span>`;
    const panelH2  = (icon, label) => `<h2><i class="ti ti-${icon}"></i> ${label}</h2>`;

    // ── Panel content builders (Extraction + Avoid Duplication) ──────────────

    function buildProfile() {
      return panelH2('user', 'Profile')
        + infoRow('id-badge', '<strong>Martin Jorrell H. Gaspar</strong> — Developer &amp; Designer')
        + infoRow('map-pin',  'Balagtas, Bulacan, Philippines')
        + infoRow('mail',     'martinjorrellgaspar@gmail.com')
        + infoRow('phone',    '0929 342 4068')
        + infoRow('school',   'BS Industrial Technology (Computer) — Bulacan State University · 2021–present')
        + infoRow('code',     'HTML · CSS · JavaScript · Python · Java · PHP · Arduino · Raspberry Pi · ESP32')
        + infoRow('heart',    'Web development, graphic design, game dev, IoT');
    }

    function buildWebsites() {
      return panelH2('world', 'Websites') + SITES.map(siteCard).join('');
    }

    function buildAchievements() {
      return panelH2('trophy', 'Achievements') + ACHIEVEMENTS.map(achievementItem).join('');
    }

    function buildResume() {
      return panelH2('file-text', 'Resume')
        + `<div class="resume-section"><h3>Experience</h3>${JOBS.map(jobRow).join('')}</div>`
        + `<div class="resume-section"><h3>Education</h3>${SCHOOLS.map(schoolRow).join('')}</div>`
        + `<div class="resume-section"><h3>Skills</h3>${SKILLS.map(resumeTag).join('')}</div>`
        + `<a href="Martin_Gaspar_CV.pdf" download class="download-link"><i class="ti ti-download"></i> Download CV (PDF)</a>`;
    }

    function buildGallery() {
      return panelH2('photo', 'Gallery')
        + `<div class="gallery-grid">
             <div class="gallery-item">🖼️</div>
             <div class="gallery-item">📸</div>
             <div class="gallery-item">🎨</div>
             <div class="gallery-item">🎮</div>
           </div>
           <p style="font-size:13px;color:#888;margin-top:0.75rem;">Replace emoji divs with &lt;img&gt; tags pointing to your photos.</p>`;
    }

    const PANEL_BUILDERS = {
      profile:      buildProfile,
      websites:     buildWebsites,
      achievements: buildAchievements,
      resume:       buildResume,
      gallery:      buildGallery,
    };

    // ── Hotspot positioning (Extraction) ─────────────────────────────────────

    function positionHotspot(el, imgWidth, imgHeight) {
      const [xr, yr] = HOTSPOT_POSITIONS[el.dataset.panel];
      el.style.left = (xr * imgWidth  - 22) + 'px';
      el.style.top  = (yr * imgHeight - 22) + 'px';
    }

    function positionAllHotspots() {
      const img = document.getElementById('roomImg');
      document.querySelectorAll('.hotspot').forEach(el => positionHotspot(el, img.offsetWidth, img.offsetHeight));
    }

    // ── Modal helpers (Extraction) ────────────────────────────────────────────

    function openPanel(panelKey) {
      document.getElementById('panelBody').innerHTML = PANEL_BUILDERS[panelKey]();
      document.getElementById('backdrop').classList.add('open');
    }

    function closePanel() {
      document.getElementById('backdrop').classList.remove('open');
    }

    // ── Loader (Extraction) ───────────────────────────────────────────────────

    function hideLoader() {
      const loader = document.getElementById('loader');
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 650);
    }

    // ── Init ──────────────────────────────────────────────────────────────────

    const roomImg = document.getElementById('roomImg');
    roomImg.addEventListener('load', positionAllHotspots);
    if (roomImg.complete) positionAllHotspots();
    window.addEventListener('resize', positionAllHotspots);

    document.querySelectorAll('.hotspot').forEach(el => {
      el.addEventListener('click', () => openPanel(el.dataset.panel));
    });

    document.getElementById('closeBtn').addEventListener('click', closePanel);

    // Inversion: early return if click is inside the panel
    document.getElementById('backdrop').addEventListener('click', e => {
      if (e.target !== e.currentTarget) return;
      closePanel();
    });

    // Merged if: toggle music state and UI in one expression
    const music    = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let playing = false;

    musicBtn.addEventListener('click', () => {
      playing = !playing;
      playing ? music.play() : music.pause();
      musicBtn.textContent = playing ? '🔊' : '🔇';
    });

    window.addEventListener('load', () => setTimeout(hideLoader, 2000));
  </script>
</body>
</html>
