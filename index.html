<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Isometric Room</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.3rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
      color: #111;
      text-shadow: none;
    }

    /* ── Room ── */
    .room-wrap {
      position: relative;
      width: 100%;
      max-width: 680px;
    }

    .room-wrap img {
      width: 100%;
      display: block;
      border-radius: 16px;
    }

    /* ── Hotspots ── */
    .hotspot {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(2px);
      transition: transform 0.15s, background 0.15s;
    }

    .hotspot:hover {
      transform: scale(1.2);
      background: rgba(255, 255, 255, 0.5);
    }

    .hotspot .pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      animation: pulse 1.8s ease-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0;   }
    }

    .hotspot i { font-size: 18px; color: #fff; pointer-events: none; }

    .hotspot-label {
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 20px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .hotspot:hover .hotspot-label { opacity: 1; }

    /* ── Modal ── */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .backdrop.open { display: flex; }

    .panel {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e5e5e5;
      padding: 1.5rem;
      width: 90%;
      max-width: 480px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .panel h2 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #111;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      font-size: 20px;
      padding: 4px;
      line-height: 1;
    }

    .close-btn:hover { color: #111; }

    /* ── Panel content helpers ── */
    .info-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #555;
      align-items: flex-start;
    }

    .info-row i { color: #111; margin-top: 2px; flex-shrink: 0; }

    .site-card {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .site-info { flex: 1; min-width: 0; }
    .site-name { font-size: 14px; font-weight: 500; color: #111; }
    .site-url  { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .achievement-item {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #333;
    }

    .achievement-item i { font-size: 18px; color: #c8a500; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .gallery-item {
      border-radius: 10px;
      background: #f0f0f0;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 1px solid #e5e5e5;
      overflow: hidden;
    }

    .resume-section { margin-bottom: 1rem; }
    .resume-section h3 {
      font-size: 12px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .resume-tag {
      display: inline-block;
      background: #f0f0f0;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      font-size: 12px;
      padding: 3px 10px;
      margin: 3px;
      color: #333;
    }

    .download-link {
      font-size: 14px;
      color: #0070f3;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      margin-top: 1rem;
    }

    .download-link:hover { text-decoration: underline; }

    /* ── Music button ── */
    .music-btn {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 200;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #5a7a4a;
      border: 2px solid #3d5c33;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: transform 0.15s, background 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .music-btn:hover { transform: scale(1.1); background: #4a6a3a; }

    /* ── Social bar ── */
    .social-bar {
      display: flex;
      gap: 12px;
      margin-top: 1.25rem;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #5a7a4a;
      border: 2px solid #3d5c33;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      text-decoration: none;
      transition: transform 0.15s, background 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .social-btn:hover { transform: scale(1.15); background: #4a6a3a; }
  </style>
</head>
<body>

  <!-- Background music -->
  <audio id="bgMusic" src="bg.mp3" loop></audio>
  <button class="music-btn" id="musicBtn" title="Toggle music">🔇</button>

  <h1>MY ROOM</h1>

  <div class="room-wrap" id="room">
    <img src="Isometric.png" alt="Isometric room" id="roomImg" />

    <div class="hotspot" data-panel="profile">
      <div class="pulse"></div>
      <i class="ti ti-user"></i>
      <span class="hotspot-label">Profile</span>
    </div>

    <div class="hotspot" data-panel="websites">
      <div class="pulse"></div>
      <i class="ti ti-world"></i>

    </div>

    <div class="hotspot" data-panel="achievements">
      <div class="pulse"></div>
      <i class="ti ti-trophy"></i>
      <span class="hotspot-label">Achievements</span>
    </div>

    <div class="hotspot" data-panel="resume">
      <div class="pulse"></div>
      <i class="ti ti-file-text"></i>
      <span class="hotspot-label">Resume</span>
    </div>

    <div class="hotspot" data-panel="gallery">
      <div class="pulse"></div>
      <i class="ti ti-photo"></i>
      <span class="hotspot-label">Gallery</span>
    </div>
  </div>

  <!-- Social links -->
  <div class="social-bar">
    <a class="social-btn" href="https://instagram.com/" target="_blank" title="Instagram"><i class="ti ti-brand-instagram"></i></a>
    <a class="social-btn" href="https://facebook.com/" target="_blank" title="Facebook"><i class="ti ti-brand-facebook"></i></a>
    <a class="social-btn" href="https://linkedin.com/in/" target="_blank" title="LinkedIn"><i class="ti ti-brand-linkedin"></i></a>
    <a class="social-btn" href="https://github.com/" target="_blank" title="GitHub"><i class="ti ti-brand-github"></i></a>
  </div>
  <div class="backdrop" id="backdrop">
    <div class="panel">
      <button class="close-btn" id="closeBtn"><i class="ti ti-x"></i></button>
      <div id="panelBody"></div>
    </div>
  </div>

  <script>
    const HOTSPOT_POSITIONS = {

      websites:     [0.275, 0.270],
      achievements: [0.685, 0.545],
      resume:       [0.515, 0.735],
      gallery:      [0.755, 0.360],
    };

    const PANELS = {
      profile: `
        <h2><i class="ti ti-user"></i> Profile</h2>
        <div class="info-row"><i class="ti ti-id-badge"></i><span><strong>Martin Jorrell H. Gaspar</strong> — Developer &amp; Designer</span></div>
        <div class="info-row"><i class="ti ti-map-pin"></i><span>Balagtas, Bulacan, Philippines</span></div>
        <div class="info-row"><i class="ti ti-mail"></i><span>martinjorrellgaspar@gmail.com</span></div>
        <div class="info-row"><i class="ti ti-phone"></i><span>0929 342 4068</span></div>
        <div class="info-row"><i class="ti ti-school"></i><span>BS Industrial Technology (Computer) — Bulacan State University · 2021–present</span></div>
        <div class="info-row"><i class="ti ti-code"></i><span>HTML · CSS · JavaScript · Python · Java · PHP · Arduino · Raspberry Pi · ESP32</span></div>
        <div class="info-row"><i class="ti ti-heart"></i><span>Web development, graphic design, game dev, IoT</span></div>
      `,
      websites: `
        <h2><i class="ti ti-world"></i> Websites</h2>
        <div class="site-card">
          <div class="site-thumb"><img src="https://www.google.com/s2/favicons?domain=panramatechnologies.com&sz=48" width="32" height="32" style="border-radius:6px"></div>
          <div class="site-info">
            <div class="site-name">Panrama Technologies</div>
            <div class="site-url">panramatechnologies.com</div>
          </div>
          <a href="https://panramatechnologies.com/" target="_blank"><i class="ti ti-external-link" style="color:#888"></i></a>
        </div>
        <div class="site-card">
          <div class="site-thumb"><img src="https://www.google.com/s2/favicons?domain=momocartlogbook.com&sz=48" width="32" height="32" style="border-radius:6px"></div>
          <div class="site-info">
            <div class="site-name">Momo Cart Logbook</div>
            <div class="site-url">momocartlogbook.com</div>
          </div>
          <a href="https://momocartlogbook.com/" target="_blank"><i class="ti ti-external-link" style="color:#888"></i></a>
        </div>
        <div class="site-card">
          <div class="site-thumb"><img src="https://www.google.com/s2/favicons?domain=blueshirt.work&sz=48" width="32" height="32" style="border-radius:6px"></div>
          <div class="site-info">
            <div class="site-name">Blueshirt HR</div>
            <div class="site-url">employers.blueshirt.work</div>
          </div>
          <a href="https://employers.blueshirt.work/hr?menu=Applicant%20Welfare&signup_step=Welcome&verif=" target="_blank"><i class="ti ti-external-link" style="color:#888"></i></a>
        </div>
        <div class="site-card">
          <div class="site-thumb"><img src="https://www.google.com/s2/favicons?domain=guanzonpool.com&sz=48" width="32" height="32" style="border-radius:6px"></div>
          <div class="site-info">
            <div class="site-name">Guanzon Pool</div>
            <div class="site-url">guanzonpool.com</div>
          </div>
          <a href="https://guanzonpool.com" target="_blank"><i class="ti ti-external-link" style="color:#888"></i></a>
        </div>
      `,
      achievements: `
        <h2><i class="ti ti-trophy"></i> Achievements</h2>
        <div class="achievement-item"><i class="ti ti-star"></i><span>Dean's Lister — Bulacan State University · 2021–present</span></div>
        <div class="achievement-item"><i class="ti ti-star"></i><span>Gold Gear Awardee — Bulacan State University · 2021–present</span></div>
        <div class="achievement-item"><i class="ti ti-star"></i><span>With Honors — Dr. Yanga's Colleges Inc.</span></div>
        <div class="achievement-item"><i class="ti ti-star"></i><span>Outstanding Scholastic Reader — Dr. Yanga's Colleges Inc.</span></div>
        <div class="achievement-item"><i class="ti ti-book"></i><span>Published research: Frequency of Engagement in Online Games &amp; Mental Health among Gen Z Youth</span></div>
        <div class="achievement-item"><i class="ti ti-book"></i><span>Published research: Winner Winner Mango Ginger — meat shelf storage study</span></div>
      `,
      resume: `
        <h2><i class="ti ti-file-text"></i> Resume</h2>
        <div class="resume-section">
          <h3>Experience</h3>
          <div class="info-row"><i class="ti ti-briefcase"></i><span><strong>Blueshirt Works PH</strong> — Intern · Dec 2025–Aug 2026<br><small>HR and applicant welfare operations support</small></span></div>
          <div class="info-row"><i class="ti ti-briefcase"></i><span><strong>Momocart Mobility Cart</strong> — Developer · Mar 2026–present<br><small>Designed and developed the Momocart Logbook system for fleet and cart management</small></span></div>
          <div class="info-row"><i class="ti ti-briefcase"></i><span><strong>Panrama Technologies</strong> — Intern · June 2024–Dec 2024<br><small>Built Panramatechnologies.com; improved SQL attendance DB; designed marketing posters</small></span></div>
          <div class="info-row"><i class="ti ti-briefcase"></i><span><strong>Lei-lo Marketing</strong> — Designer · Aug 2020–Jan 2023<br><small>Produced promotional posters and marketing materials for various campaigns</small></span></div>
          <div class="info-row"><i class="ti ti-briefcase"></i><span><strong>Deviant Gallerry</strong> — Part-Time · Dec 2020–Aug 2022<br><small>Designed print-ready T-shirts; created client logos using Infinite Design &amp; Kritika</small></span></div>
        </div>
        <div class="resume-section">
          <h3>Education</h3>
          <div class="info-row"><i class="ti ti-school"></i><span><strong>Bulacan State University</strong> — BS Industrial Technology (Computer) · 2021–present<br><small>Dean's Lister · Gold Gear Awardee</small></span></div>
          <div class="info-row"><i class="ti ti-school"></i><span><strong>Dr. Yanga's Colleges Inc.</strong> — Senior High ICT · 2015–2021<br><small>With Honors · Outstanding Scholastic Reader</small></span></div>
        </div>
        <div class="resume-section">
          <h3>Skills</h3>
          <span class="resume-tag">HTML/CSS</span>
          <span class="resume-tag">JavaScript</span>
          <span class="resume-tag">Python</span>
          <span class="resume-tag">Java</span>
          <span class="resume-tag">PHP</span>
          <span class="resume-tag">Arduino</span>
          <span class="resume-tag">Raspberry Pi</span>
          <span class="resume-tag">ESP32</span>
          <span class="resume-tag">SQL</span>
          <span class="resume-tag">Graphic Design</span>
          <span class="resume-tag">Game Dev</span>
        </div>
        <a href="Martin_Gaspar_CV.pdf" download class="download-link">
          <i class="ti ti-download"></i> Download CV (PDF)
        </a>
      `,
      gallery: `
        <h2><i class="ti ti-photo"></i> Gallery</h2>
        <div class="gallery-grid">
          <div class="gallery-item">🖼️</div>
          <div class="gallery-item">📸</div>
          <div class="gallery-item">🎨</div>
          <div class="gallery-item">🎮</div>
        </div>
        <p style="font-size:13px;color:#888;margin-top:0.75rem;">
          Replace emoji divs with &lt;img&gt; tags pointing to your photos.
        </p>
      `,
    };

    function positionHotspots() {
      const img = document.getElementById('roomImg');
      const w = img.offsetWidth;
      const h = img.offsetHeight;
      document.querySelectorAll('.hotspot').forEach(el => {
        const [xr, yr] = HOTSPOT_POSITIONS[el.dataset.panel];
        el.style.left = (xr * w - 22) + 'px';
        el.style.top  = (yr * h - 22) + 'px';
      });
    }

    const img = document.getElementById('roomImg');
    img.addEventListener('load', positionHotspots);
    if (img.complete) positionHotspots();
    window.addEventListener('resize', positionHotspots);

    const backdrop = document.getElementById('backdrop');
    const panelBody = document.getElementById('panelBody');

    document.querySelectorAll('.hotspot').forEach(el => {
      el.addEventListener('click', () => {
        panelBody.innerHTML = PANELS[el.dataset.panel];
        backdrop.classList.add('open');
      });
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      backdrop.classList.remove('open');
    });

    backdrop.addEventListener('click', e => {
      if (e.target === backdrop) backdrop.classList.remove('open');
    });

    // ── Music toggle ──────────────────────────────────────────────────────────
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let playing = false;

    musicBtn.addEventListener('click', () => {
      if (playing) {
        music.pause();
        musicBtn.textContent = '🔇';
      } else {
        music.play();
        musicBtn.textContent = '🔊';
      }
      playing = !playing;
    });
  </script>
</body>
</html>
